spring:
  application:
    name: back
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    active: dev

  # 빈 객체 직렬화 예외 방지
  jackson:
    serialization:
      fail-on-empty-beans: false

  # Elasticsearch 주소 설정
  elasticsearch:
    uris: http://localhost:9200

# 패키지의 로그 레벨을 debug로 설정
logging:
  level:
    com:
      back: debug

server:
  port: 8090